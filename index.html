<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus:_:Ostave for ONLINE</title>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding: 30px 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 5px;
      color: #00f5d4;
    }
    .playlist {
      margin: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button {
      padding: 16px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: #1f1f1f;
      border: 2px solid #00b4d8;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    button.active {
      background: #00b4d8;
      box-shadow: 0 4px 15px rgba(0, 180, 216, 0.4);
    }
    #now-playing {
      margin-top: 20px;
      font-size: 0.95rem;
      color: #00f5d4;
      font-weight: bold;
    }
    audio {
      margin-top: 20px;
      width: 100%;
      max-width: 320px;
    }
  </style>
</head>
<body>

  <h1>Nexus:_:Ostave for ONLINE</h1>
  <p>楽曲プレイヤー (全4曲)</p>

  <div id="now-playing">曲を選んでください</div>

  <!-- 4曲を切り替えるボタンのリスト -->
  <div class="playlist" id="playlist"></div>

  <audio id="audio-player" controls preload="auto"></audio>

  <script>
    // 🎵 あなたのアップロードした4曲のプレイリストデータ
    const songs = [
      { 
        title: "SPECIALZ", 
        url: "https://raw.githubusercontent.com/nexusostave1124/Nexus-_-Ostave-for-ONLINE/main/SPECIALZ.mp3" 
      },
      { 
        title: "ハウトゥー世界征服", 
        url: "https://raw.githubusercontent.com/nexusostave1124/Nexus-_-Ostave-for-ONLINE/main/%E3%83%8F%E3%82%A6%E3%83%88%E3%82%A5%E3%83%BC%E4%B8%96%E7%95%8C%E5%BE%81%E6%9C%8D%20(4).mp3" 
      },
      { 
        title: "ロストワンの号哭", 
        url: "https://raw.githubusercontent.com/nexusostave1124/Nexus-_-Ostave-for-ONLINE/main/%E3%83%AD%E3%82%B9%E3%83%88%E3%83%AF%E3%83%B3%E3%81%의%E5%8F%B7%E5%93%AD.mp3" 
      },
      { 
        title: "一途", 
        url: "https://raw.githubusercontent.com/nexusostave1124/Nexus-_-Ostave-for-ONLINE/main/%E4%B8%80%E9%80%94.mp3" 
      }
    ];

    const audioPlayer = document.getElementById('audio-player');
    const playlistContainer = document.getElementById('playlist');
    const nowPlaying = document.getElementById('now-playing');
    
    let currentIndex = 0;

    // プレイリストのボタンを画面に並べる
    function initPlaylist() {
      playlistContainer.innerHTML = "";
      songs.forEach((song, index) => {
        const btn = document.createElement('button');
        btn.innerText = `▶ ${song.title}`;
        btn.onclick = () => playSong(index);
        playlistContainer.appendChild(btn);
      });
    }

    // 指定した曲を再生する
    function playSong(index) {
      currentIndex = index;
      const song = songs[currentIndex];
      
      audioPlayer.src = song.url;
      audioPlayer.play().then(() => {
        nowPlaying.innerText = `再生中: ${song.title}`;
        updateActiveButton();
      }).catch(err => {
        console.log("再生エラー:", err);
        nowPlaying.innerText = `❌ 再生失敗: ${song.title} (読み込み中...)`;
      });
    }

    // 選ばれているボタンの色を変える
    function updateActiveButton() {
      const buttons = playlistContainer.getElementsByTagName('button');
      for (let i = 0; i < buttons.length; i++) {
        if (i === currentIndex) {
          buttons[i].classList.add('active');
        } else {
          buttons[i].classList.remove('active');
        }
      }
    }

    // 初期化実行
    initPlaylist();
  </script>

</body>
</html>
