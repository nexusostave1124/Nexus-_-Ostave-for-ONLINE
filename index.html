<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nexus:_:Ostave for ONLINE</title>
    <!-- 🖋️ Google Fontsから「しっぽり明朝 (Shippori Mincho)」を読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #050505;
            color: #fff;
            font-family: "Shippori Mincho", "MS Mincho", "MS 明朝", "游明朝", YuMincho, serif;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        /* 📱 メイン画面エリア */
        .app-container {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        /* 🖼️ 背景スライドショー */
        .bg-slideshow {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        .slide-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }
        .slide-img.active {
            opacity: 1;
        }
        /* 上下グラデーション */
        .overlay-top {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 160px;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            z-index: 2;
            pointer-events: none;
        }
        .overlay-bottom {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 160px;
            background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            z-index: 2;
            pointer-events: none;
        }
        /* UI要素 */
        .ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }
        /* メニューボタン等 */
        .header-area {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .menu-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }
        /* アルバムモーダル */
        #album-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            flex-direction: column;
            padding: 20px;
        }
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            overflow-y: auto;
            flex: 1;
            padding: 10px 0;
        }
        .album-item {
            aspect-ratio: 1;
            background: #222;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .album-item.selected {
            border-color: #ff0055;
        }
        .album-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 背景スライドショー -->
        <div class="bg-slideshow" id="bg-slideshow">
            <!-- 動的に画像が挿入されます -->
        </div>

        <div class="overlay-top"></div>
        <div class="overlay-bottom"></div>

        <!-- UIレイヤー -->
        <div class="ui-layer">
            <div class="header-area">
                <button class="menu-btn interactive" onclick="openAlbum()">アルバム</button>
            </div>
            <div></div>
        </div>
    </div>

    <!-- アルバム画面 -->
    <div id="album-modal">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="font-size: 1.2rem;">アルバム管理</h2>
            <button class="menu-btn" onclick="closeAlbum()">閉じる</button>
        </div>
        <div class="album-grid" id="album-grid">
            <!-- 動的に画像リストが読み込まれます -->
        </div>
    </div>

    <script>
        // Gistから画像リストを取得するURL（あなたのGistのraw URL）
        const GIST_JSON_URL = 'https://gist.githubusercontent.com/nexusostave1124/ac1c05eaf442b0dcb34514cb7ed804a7/raw/images.json';

        let albumImages = [];
        let slideshowIds = [];
        let currentSlideIndex = 0;
        let slideInterval = null;

        // 初期化処理
        async function initApp() {
            await fetchImagesFromGist();
            startSlideshow();
        }

        // Gistから最新の画像データを取得
        async function fetchImagesFromGist() {
            try {
                const response = await fetch(GIST_JSON_URL + '?t=' + new Date().getTime());
                const data = await response.json();
                if (Array.isArray(data) && data.length > 0) {
                    albumImages = data;
                    // デフォルトですべてのスライドショー対象にする
                    slideshowIds = data.map(item => item.id);
                }
            } catch (error) {
                console.error("画像データの取得に失敗しました:", error);
            }
        }

        // スライドショーの描画
        function startSlideshow() {
            const container = document.getElementById('bg-slideshow');
            container.innerHTML = '';

            const activeImages = albumImages.filter(img => slideshowIds.includes(img.id));
            if (activeImages.length === 0) return;

            activeImages.forEach((imgData, index) => {
                const img = document.createElement('img');
                img.src = imgData.url;
                img.className = 'slide-img' + (index === 0 ? ' active' : '');
                container.appendChild(img);
            });

            if (slideInterval) clearInterval(slideInterval);
            if (activeImages.length > 1) {
                slideInterval = setInterval(() => {
                    const imgs = container.querySelectorAll('.slide-img');
                    if (imgs.length === 0) return;
                    imgs[currentSlideIndex].classList.remove('active');
                    currentSlideIndex = (currentSlideIndex + 1) % imgs.length;
                    imgs[currentSlideIndex].classList.add('active');
                }, 5000);
            }
        }

        // アルバム画面を開く
        function openAlbum() {
            const grid = document.getElementById('album-grid');
            grid.innerHTML = '';

            albumImages.forEach(imgData => {
                const item = document.createElement('div');
                item.className = 'album-item' + (slideshowIds.includes(imgData.id) ? ' selected' : '');
                item.onclick = () => toggleSlide(imgData.id, item);

                const img = document.createElement('img');
                img.src = imgData.url;
                item.appendChild(img);

                grid.appendChild(item);
            });

            document.getElementById('album-modal').style.display = 'flex';
        }

        // アルバム画面を閉じる
        function closeAlbum() {
            document.getElementById('album-modal').style.display = 'none';
            startSlideshow();
        }

        // スライド対象の切り替え
        function toggleSlide(id, element) {
            if (slideshowIds.includes(id)) {
                slideshowIds = slideshowIds.filter(i => i !== id);
                element.classList.remove('selected');
            } else {
                slideshowIds.push(id);
                element.classList.add('selected');
            }
        }

        // 起動実行
        window.onload = initApp;
    </script>
</body>
</html>
